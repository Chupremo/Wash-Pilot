<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">WashPilot 3D carwash operations scene</title>
<desc id="desc">A polished blue carwash scene with a detailed vehicle, mobile WashPilot dashboard and receipt terminal.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123c70" stop-opacity=".08"/><stop offset=".52" stop-color="#1c76d2" stop-opacity=".22"/><stop offset="1" stop-color="#071a33" stop-opacity=".5"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1f75c7"/><stop offset=".45" stop-color="#0b2b51"/><stop offset="1" stop-color="#071a33"/></linearGradient>
 <linearGradient id="paint" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#e8f6ff"/><stop offset=".15" stop-color="#8bbbe3"/><stop offset=".36" stop-color="#1b497b"/><stop offset=".68" stop-color="#0b2548"/><stop offset="1" stop-color="#07162d"/></linearGradient>
 <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effaff"/><stop offset=".24" stop-color="#65a6d9"/><stop offset=".5" stop-color="#1e568f"/><stop offset="1" stop-color="#0b2343"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4f5ff"/><stop offset=".22" stop-color="#3975a7"/><stop offset=".72" stop-color="#102746"/><stop offset="1" stop-color="#07172d"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4b7da6"/><stop offset=".2" stop-color="#effaff"/><stop offset=".52" stop-color="#668bad"/><stop offset=".8" stop-color="#e9f6ff"/><stop offset="1" stop-color="#37618a"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f2ff"/></linearGradient>
 <linearGradient id="device" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203f65"/><stop offset=".5" stop-color="#071a33"/><stop offset="1" stop-color="#020b18"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2b94e8" stop-opacity=".0"/><stop offset=".35" stop-color="#5ac8ff" stop-opacity=".8"/><stop offset=".7" stop-color="#d8f7ff" stop-opacity=".7"/><stop offset="1" stop-color="#2b94e8" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
