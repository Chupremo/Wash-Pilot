name: WashPilot launch checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  critical-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify online booking sales
        run: node tests/booking-payments.test.cjs
      - name: Verify dashboard summaries
        run: node tests/dashboard-overview.test.cjs
      - name: Verify canonical sign-in and dashboard routes
        run: node tests/login-routing.test.cjs
      - name: Parse all inline and homepage JavaScript
        run: node tests/inline-js-syntax.test.cjs
      - name: Check homepage feature runtime syntax
        run: node --check washpilot-home-features.js
