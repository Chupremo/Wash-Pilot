name: WashPilot launch checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  critical-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify online booking sales
        run: node tests/booking-payments.test.cjs
      - name: Verify dashboard summaries
        run: node tests/dashboard-overview.test.cjs
      - name: Verify canonical sign-in and dashboard routes
        run: node tests/login-routing.test.cjs
      - name: Parse all inline and homepage JavaScript
        run: node tests/inline-js-syntax.test.cjs
      - name: Verify Cloudflare route dispatch
        run: node tests/cloudflare-routing.test.cjs
      - name: Detect Cloudflare deployment credentials
        id: cloudflare-auth
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare production deployment skipped because the CLOUDFLARE_API_TOKEN repository secret is not configured."
          fi
      - name: Deploy Cloudflare Worker
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare-auth.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --account-id 148d653601f5f68b59b0a486173f7ca3
      - name: Check homepage feature runtime syntax
        run: node --check washpilot-home-features.js
