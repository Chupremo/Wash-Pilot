<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · WashPilot</title>
<meta name="description" content="The page you are looking for could not be found.">
<meta name="robots" content="noindex">
<link rel="icon" href="washpilot-logo.svg" type="image/svg+xml">
<script>
/* ============ EDIT HERE ============ */
const CONFIG = {
  /* When the site is live, set this to "/" so links and the logo still work
     if someone lands here from a deep address like /a/b/c.
     Leave it empty while opening the files locally from a folder. */
  basePath: "/",
  homeUrl: "/home.html",
  signinUrl: "/signin.html",
  contactEmail: ""   // if filled, a "Contact us" link appears
};
/* =================================== */
if (CONFIG.basePath) {
  const b = document.createElement("base");
  b.href = CONFIG.basePath;
  document.head.prepend(b);
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0b;
  --blue:#1f5eff; --blue-d:#1648d6; --blue-l:#6b9bff;
  --line:#e4e6ea;
  --text:#0a0a0b; --text-2:#454c5a; --muted:#6a7180;
  --font-d:"Sora",system-ui,sans-serif;
  --font:"DM Sans",system-ui,sans-serif;
  --r-ctl:12px; --r-card:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--text);background:#fff;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--black);color:#fff;padding:10px 16px;border-radius:var(--r-ctl);z-index:100}
.skip:focus{left:8px}

.top{max-width:1180px;width:100%;margin:0 auto;padding:24px}
.logo{display:inline-block}
.logo img{height:36px;width:auto}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px 48px}
.card{
  position:relative;overflow:hidden;width:100%;max-width:760px;text-align:center;color:#fff;
  background:var(--black);border-radius:var(--r-card);padding:64px 32px;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(480px 340px at 90% 0%,rgba(31,94,255,.45),transparent 70%),
    radial-gradient(380px 300px at 0% 100%,rgba(31,94,255,.25),transparent 70%);
}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);
          mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);
}
.card > *{position:relative;z-index:1}
.code{
  font-family:var(--font-d);font-weight:800;letter-spacing:-.05em;line-height:1;
  font-size:clamp(88px,18vw,160px);
  background:linear-gradient(135deg,#fff 20%,var(--blue-l));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-family:var(--font-d);font-weight:800;letter-spacing:-.03em;line-height:1.1;font-size:clamp(24px,3.4vw,34px);margin:20px 0 12px}
.lede{color:rgba(255,255,255,.72);font-size:17px;max-width:460px;margin:0 auto}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:50px;padding:0 26px;font:inherit;font-weight:600;font-size:16px;
  border:1.5px solid transparent;border-radius:var(--r-ctl);text-decoration:none;
  transition:background .15s,transform .15s,border-color .15s;
}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px rgba(31,94,255,.6)}
.btn-primary:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn-outline{color:#fff;border-color:rgba(255,255,255,.28)}
.btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.contact{margin-top:28px;font-size:14.5px;color:rgba(255,255,255,.6)}
.contact a{color:#fff;font-weight:600}
[hidden]{display:none!important}

footer{max-width:1180px;width:100%;margin:0 auto;padding:0 24px 28px;font-size:13.5px;color:var(--muted)}

@media (max-width:520px){
  .card{padding:48px 20px}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
<link rel="stylesheet" href="/washpilot-design.css?v=20261117">
<script src="/washpilot-accessibility.js?v=20261117" defer></script>
</head>
<body class="wp-page-error">
<a class="skip" href="#content">Skip to content</a>

<header class="top">
  <a class="logo" id="logoLink" href="home.html" aria-label="WashPilot home">
    <img src="washpilot-logo.svg" alt="WashPilot" height="36">
  </a>
</header>

<main id="content">
  <section class="card" aria-labelledby="title">
    <p class="code" aria-hidden="true">404</p>
    <h1 id="title">We can't find that page</h1>
    <p class="lede">The link may be broken, or the page may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a class="btn btn-primary" id="homeBtn" href="home.html">Back to home</a>
      <a class="btn btn-outline" id="signinBtn" href="signin.html">Sign in</a>
    </div>
    <p class="contact" id="contact" hidden>Need help? <a id="contactLink">Contact us</a></p>
  </section>
</main>

<footer id="foot"></footer>

<script>
const $ = id => document.getElementById(id);
$("logoLink").href = CONFIG.homeUrl;
$("homeBtn").href = CONFIG.homeUrl;
$("signinBtn").href = CONFIG.signinUrl;
if (CONFIG.contactEmail) {
  $("contactLink").href = "mailto:" + CONFIG.contactEmail;
  $("contact").hidden = false;
}
$("foot").textContent = "© " + new Date().getFullYear() + " WashPilot";
</script>
</body>
</html>
